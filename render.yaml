# Blueprint de Render: crea el servicio web a partir del Dockerfile.
# Los datos de la base MySQL (externa) se piden al crear el servicio (sync: false).
services:
  - type: web
    name: clinica-salud-total
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: MAIL_GMAIL_USER
        sync: false
      - key: MAIL_GMAIL_PASSWORD
        sync: false
